<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stitch Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Cosplay Rental Gallery</h1>
    <p class="subtitle">Find your next cosplay here!</p>

    <div class="gallery">
      <div class="item">
        <img src="images/IMG_1612.png" alt="Maomao cosplay" />
        <h3>Maomao</h3>
        <p class="price">₱2,500</p>
        <button onclick="rentItem('Maomao', 2500)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1613.png" alt="Frieren cosplay" />
        <h3>Frieren</h3>
        <p class="price">₱3,200</p>
        <button onclick="rentItem('Frieren', 3200)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1614.png" alt="Kakegurui cosplay" />
        <h3>Kakegurui</h3>
        <p class="price">₱1,000</p>
        <button onclick="rentItem('Kakegurui', 1000)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1615.png" alt="Miku cosplay" />
        <h3>Miku</h3>
        <p class="price">₱2,500</p>
        <button onclick="rentItem('Miku', 2500)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1616.png" alt="Fern wig" />
        <h3>Fern Wig</h3>
        <p class="price">₱600</p>
        <button onclick="rentItem('Fern Wig', 600)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1617.png" alt="Fern cosplay" />
        <h3>Fern</h3>
        <p class="price">₱1,700</p>
        <button onclick="rentItem('Fern', 1700)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1618.png" alt="Miku wig" />
        <h3>Miku Wig</h3>
        <p class="price">₱800</p>
        <button onclick="rentItem('Miku Wig', 800)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1619.png" alt="Frieren wig" />
        <h3>Frieren Wig</h3>
        <p class="price">₱700</p>
        <button onclick="rentItem('Frieren Wig', 700)">Rent Now</button>
      </div>

      <div class="item">
        <img src="images/IMG_1620.png" alt="Maomao wig" />
        <h3>Maomao Wig</h3>
        <p class="price">₱1,200</p>
        <button onclick="rentItem('Maomao Wig', 1200)">Rent Now</button>
      </div>
    </div>

    <script>
      function rentItem(name, price) {
        const message =
          "Hi! I would like to rent " +
          name +
          " for ₱" +
          price.toLocaleString("en-PH") +
          ". Is it available?";

        const whatsappNumber = ""; // Add your WhatsApp number here
        const phone = whatsappNumber.replace(/\D/g, "");

        if (phone) {
          window.open(
            "https://wa.me/" + phone + "?text=" + encodeURIComponent(message),
            "_blank",
          );
        } else {
          alert(
            message + "\n\nPlease contact the seller to confirm availability.",
          );
        }
      }
    </script>
  </body>
</html>
